[gcode_macro _Z_TILT_MAYBE]
gcode:
  {% if printer["gcode_macro Z_TILT_ADJUST"].adjusted != 1 %}
    Z_TILT_ADJUST
  {% else %}
    {action_respond_info("Z tilt already adjusted, skipping.")} 
  {% endif %}

[gcode_macro Z_TILT_ADJUST]
rename_existing: OG_Z_TILT_ADJUST
variable_adjusted: 0
gcode:
  OG_Z_TILT_ADJUST
  SET_GCODE_VARIABLE MACRO=Z_TILT_ADJUST VARIABLE=adjusted VALUE=1

[gcode_macro LUBE_Z]
description: Drop & raise Z-axis for lubrication only
gcode:
  {% set depth = params.DEPTH|default(5) %}
  {% set speed = params.SPEED|default(300) %}
  {% set dwell = params.DWELL|default(1000) %}
  G28                     
  G1 Z{depth} F{speed}    
  G4 P{dwell}              
  G1 Z0 F{speed}       

[gcode_macro FLOW_SWEEP_PLA]
description: Sweep volumetric flow by extrusion only (PLA 220C, 12→36 mm³/s step 2, 3s pause)
# ใช้:  FLOW_SWEEP_PLA
# ตัวเลือก (ถ้าจะเปลี่ยนค่า): FLOW_SWEEP_PLA START=12 END=36 STEP=2 WAIT=3 HOTEND=220 LENGTH=100 DIAMETER=1.75
variable_start: 12
variable_end: 36
variable_step: 2
variable_wait: 3            # seconds between steps
variable_hotend: 220        # °C
variable_length: 100        # mm of filament per step
variable_diameter: 1.75     # filament diameter (mm)
gcode:
  {% set START   = params.START|default(start)|int %}
  {% set END     = params.END|default(end)|int %}
  {% set STEP    = params.STEP|default(step)|int %}
  {% set WAIT_S  = params.WAIT|default(wait)|int %}
  {% set T_HOT   = params.HOTEND|default(hotend)|float %}
  {% set LENGTH  = params.LENGTH|default(length)|float %}
  {% set DIA     = params.DIAMETER|default(diameter)|float %}
  {% set AREA    = 3.14159265 * (DIA * DIA) / 4.0 %}

  # เตรียมเครื่อง
  M104 S{T_HOT}
  M109 S{T_HOT}
  M106 S0
  SET_PRESSURE_ADVANCE ADVANCE=0
  G90
  M83
  G92 E0
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  G1 Z10 F600
  G1 X20 Y20 F9000

  RESPOND TYPE=note MSG="Start flow sweep: {START}→{END} mm^3/s (step {STEP}), LENGTH={LENGTH} mm, DIA={DIA} mm @ {T_HOT}C"

  {% for Q in range(START, END + 1, STEP) %}
    {% set E_SPEED = Q / AREA %}         ; mm/s of filament
    {% set FEED   = E_SPEED * 60.0 %}    ; mm/min for G1 F
    {% set TIME   = LENGTH / E_SPEED %}  ; seconds (extrusion duration)
    RESPOND TYPE=note MSG="Flow={Q} mm^3/s | E_speed={E_SPEED|round(2)} mm/s | Feed={FEED|round(0)} mm/min | ~{TIME|round(1)} s"
    G1 E{LENGTH} F{FEED}
    G4 P{WAIT_S * 1000}
  {% endfor %}

  RESPOND TYPE=note MSG="Flow sweep done."
  G1 E-2 F1800
  M104 S0
   
[gcode_macro NOZZLE_WIPE]
gcode:
    G90
    G1 X393 Y22 F18000
    {% for i in range(3) %}
        G1 Y15 F12000
        G1 Y25 F12000
    {% endfor %}
    G1 X393 Y17 F6000

