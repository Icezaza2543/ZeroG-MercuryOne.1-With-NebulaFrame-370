[gcode_macro PRINT_START]
gcode:
  {% set target_bed = params.BED_TEMP|default(50)|int %}
  {% set target_extruder = params.EXTRUDER_TEMP|default(240)|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  M140 S{target_bed}
  M104 S140

  M190 S{target_bed}

  {% if target_bed >= 100 and target_bed <= 120 %}
    {action_respond_info("Bed temp is between 100-120C. Soaking for 5 minutes...")}
    G4 P300000                ; Soak 5 นาที สำหรับ ABS/ASA
  {% elif target_bed >= 70 and target_bed <= 90 %}
    {action_respond_info("Bed temp is between 70-90C. Soaking for 2 minutes...")}
    G4 P120000                ; Soak 2 นาที สำหรับ PETG
  {% endif %}
  G28
  _Z_TILT_MAYBE
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE

  SMART_PARK
  M109 S{target_extruder}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target_extruder-2}

  LINE_PURGE             
  {action_respond_info("Printer goes brr")}

[gcode_macro PRINT_END]
gcode:
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    
    {% if printer.toolhead.position.x < (max_x - 15) %}
        {% set x_safe = 10.0 %}
    {% else %}
        {% set x_safe = -10.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 15) %}
        {% set y_safe = 10.0 %}
    {% else %}
        {% set y_safe = -10.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 50.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    M400                             ; wait for buffer to clear
    G92 E0                           ; zero the extruder
    G1 E-10.0 F3600                   ; retract 10mm
    G91                              ; relative positioning
    G0 Z{z_safe} + Z10 F3600         ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000    ; move nozzle to remove stringing
    M104 S0                          ; turn off hotend
    M140 S0                          ; turn off bed
    M106 S0                          ; turn off fan
    G90                              ; absolute positioning
    G0 X395.5 Y22 F18000   ; park nozzle at Front
    G0 X395.5 Y14 F6000    ; park nozzle at Parker
    G0 Z360 F1200
    M117 Finished!

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
variable_extrude: 1.0
variable_saved_extruder_temp: 0
gcode:
    {% set x_inter = 393 %}
    {% set y_inter = 22 %}
    {% set x_park = 395.5 %}
    {% set y_park = 14 %}
    {% set z = params.Z|default(10)|float %}
    {% set e = params.E|default(1) %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift_z = z|abs %}
    {% if act_z < (max_z - lift_z) %}
        {% set z_safe = lift_z %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=saved_extruder_temp VALUE={printer.extruder.target}
    SAVE_GCODE_STATE NAME=PAUSE_state
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E-{e} F2100
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    
    {% if "xyz" in printer.toolhead.homed_axes %}    
        G1 Z{z_safe} F600
        G90
        G1 X{x_inter} Y{y_inter} F6000
        G1 X{x_park} Y{y_park} F6000
    {% else %}
        {action_respond_info("Printer not homed")}
    {% endif %}
    M104 S150

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    {% set e = params.E|default(3) %}
    {% set x_inter = 393 %}
    {% set y_inter = 22 %}
    
    {% if 'VELOCITY' in params|upper %}
        {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
    {% else %}
        {% set get_params = "" %}
    {% endif %}
    
    {% set saved_temp = printer["gcode_macro PAUSE"].saved_extruder_temp %}
    {% if saved_temp > 0 %}
        M109 S{saved_temp}
    {% endif %}
    
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91
        G1 E{e} F2100
        G90
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    G90
    G1 X{x_inter} Y{y_inter} F6000
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    RESUME_BASE {get_params}

[gcode_macro M18]
rename_existing: M1800
gcode:
  M1800 {rawparams}
  SET_GCODE_VARIABLE MACRO=Z_TILT_ADJUST VARIABLE=adjusted VALUE=0

[gcode_macro M84]
rename_existing: M8400
gcode:
  M8400 {rawparams}
  SET_GCODE_VARIABLE MACRO=Z_TILT_ADJUST VARIABLE=adjusted VALUE=0

[gcode_macro G29]
gcode:
    M140 S110
    M190 S110
    G28
    #Z_TILT_ADJUST
    BED_MESH_CALIBRATE profile=mesh
    #BED_MESH_PROFILE SAVE=mesh 
    SAVE_CONFIG

[gcode_macro LOAD_MATERIAL]
gcode:
  {% if printer.extruder.temperature < 240 %}
  M104 S240
  {% endif %}
  NOZZLE_WIPE
  G1 X390 Y65 F12000
  G1 X390 Y53 F12000
  G91
  G1 E140 F180
  
[gcode_macro LOAD_FILAMENT]
gcode:
  {% set load_temp = params.T|default(250)|int %}
  # SPEED เป็น mm/min แต่ล็อกไม่ให้เกิน 600 (10 mm/s)
  {% set req_speed = params.SPEED|default(600)|int %}
  {% set max_speed = 600 %}
  {% set speed = req_speed if req_speed <= max_speed else max_speed %}
  SAVE_GCODE_STATE NAME=LOAD_STATE
  # รอหัวถึง temp ก่อน
  {% if printer.extruder.temperature < load_temp - 5 %}
    M109 S{load_temp}
  {% endif %}
  G91
  G92 E0
  # โหลดเส้น 135 mm @ speed ≤ 10 mm/s
  G1 E135 F{speed}
  RESTORE_GCODE_STATE NAME=LOAD_STATE

[gcode_macro QUIT_MATERIAL]
gcode:
  SAVE_GCODE_STATE NAME=myMoveState
  M109 S240
  M83                   # Put the extruder into relative mode
  G92 E0.0              # Reset the extruder so that it thinks it is at position zero
  G1 E-125 F350          # Move the extruder forward 120mm at a speed of 350mm/minute
  G92 E0.0              # Reset the extruder again
  M82                   # Put the extruder back into absolute mode.
  RESTORE_GCODE_STATE NAME=myMoveState

[gcode_macro UNLOAD_FILAMENT]
description: "Unload filament with a configurable two-stage retraction"

variable_default_temp: 240          # อุณหภูมิเริ่มต้น (สำหรับ PETG/ABS/ASA)
variable_prime_dist: 5              # ระยะดันเส้นเพื่อลดแรงดัน (mm)
variable_fast_retract_dist: 60      # ระยะดึงเร็วเพื่อเคลียร์ Hotend (mm)
variable_slow_retract_dist: 55      # ระยะดึงช้าเพื่อเคลียร์ชุดขับ (mm)
variable_fast_retract_speed: 3000   # ความเร็วในการดึงเร็ว (mm/min -> 50mm/s)
variable_slow_retract_speed: 1500   # ความเร็วในการดึงช้า (mm/min -> 25mm/s)
variable_turn_off_heater: True      # ปิด Heater หลังทำงานเสร็จ (True/False)

gcode:
    {% set TEMP = params.T|default(default_temp)|float %}
    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
    M117 Heating for Unload...
    {% if printer.extruder.temperature < TEMP %}
        M109 S{TEMP}      # ทำความร้อนเมื่ออุณหภูมิต่ำกว่าที่กำหนดเท่านั้น
    {% endif %}
    G91
    M117 Unloading...         # เริ่มกระบวนการดึงเส้นแบบสองจังหวะ
    G1 E{prime_dist} F300
    G1 E-{fast_retract_dist} F{fast_retract_speed}
    G1 E-{slow_retract_dist} F{slow_retract_speed}
    {% if turn_off_heater %}
        M104 S0 # ปิด Heater
    {% endif %}
    G90
    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
    M117 Unload Complete!

[gcode_macro Filament_Change]
gcode:
    # Save the G-code state
    SAVE_GCODE_STATE NAME=filament_change

    # Move the extruder to the side
    G1 X5 Y225 F4000
    
    # Unload the filament
    {% if printer.extruder.can_reverse %} 
        G91
        G1 E-10 F100
        G92 E0
        G90
    {% else %}
        M117 Extruder cannot reverse
    {% endif %}
    # Wait for user interaction to confirm new roll of filament
    M117 Please insert new filament and confirm
    # Prime the nozzle with new filament
    G91
    G1 E10 F100
    G92 E0
    G1 E5 F200
    G90
    # Restore the G-code state
    RESTORE_GCODE_STATE NAME=filament_change

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    G91 # Set to incremental mode
    G0 Z10 F600 # raise extruder
    G90 # Set back to absolute mode
    TURN_OFF_HEATERS
    NOZZLE_WIPE
    G0 X390 Y51 F18000 # Clear Print
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT

[gcode_macro PID_HOTEND]
#variable_target_temp: 240
gcode:
    {% set TARGET_TEMP_HOTEND = params.TARGET_TEMP_HOTEND|default(target_temp) %}
    M104 S{TARGET_TEMP_HOTEND}
    PID_CALIBRATE HEATER=extruder TARGET={TARGET_TEMP_HOTEND}
    SAVE_CONFIG

[gcode_macro PID_BED]
#variable_target_temp: 100
gcode:
    {% set TARGET_TEMP_BED = params.TARGET_TEMP_BED|default(target_temp_bed) %}
    M140 S{TARGET_TEMP_BED}
    PID_CALIBRATE HEATER=heater_bed TARGET={TARGET_TEMP_BED}
    SAVE_CONFIG

[gcode_macro LOOP_TEST]
gcode:
    G28 ; Home all axes
    {% set vel = (500,600) %}               # set velocity values to be tested (mm/s)
    {% set accel = (8000,12000) %}       # set accel values to be tested (mm/s^2)
    {% set min = 10 %}                           # set the square lower left point
    {% set max = 370 %}                         # set the square upper right corner

    G1 Z10 F1000
    G1 X{min} Y{min} F12000

    {% for V in vel %}
        {% set machineVel = V*60 %}
        {% for A in accel %}
            M118 velocity:{V}mm/s, accel:{A}mm/s^2
            SET_VELOCITY_LIMIT VELOCITY={V}
            SET_VELOCITY_LIMIT ACCEL={A}

            # Execute moves with the set limits
            G1 X{max} Y{min} F{machineVel}
            G1 X{max} Y{max}
            G1 X{min} Y{min}
            G1 X{min} Y{max}
            G1 X{max} Y{min}
            G1 X{max} Y{min}
            G1 X{max} Y{max}
            G1 X{min} Y{max}
            G1 X{min} Y{min}
            # Small pause for observation
            G4 P1000
        {% endfor %}
    {% endfor %}

