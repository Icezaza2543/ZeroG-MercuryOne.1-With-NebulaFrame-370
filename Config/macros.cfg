[gcode_macro TEST100C10MIN]
gcode:
    G28
    ; Move the bed down by 20mm
    G1 Z20 F3000
    ; Start heating the bed to 100°C and wait until target temperature is reached
    M190 S100
    ; Display message and soak for 10 minutes (600,000 milliseconds)
    SET_DISPLAY_TEXT MSG="Soak for 10 minutes"
    G4 P600000
    ; Output all sensor values
    M105
    ; Turn off the heatbed by setting temperature to 0°C
