[gcode_macro WAIT_CHAMBER_TEMP]
description: Waits for the chamber temperature to reach a target using TEMPERATURE_WAIT
gcode:
  {% set TARGET_TEMP = params.TARGET|default(40)|float %}
  {action_respond_info("Waiting for chamber to reach %.1f C..." % TARGET_TEMP)}
  TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_average" MINIMUM={TARGET_TEMP}
  {action_respond_info("Chamber temperature has reached the target.")}


[gcode_macro SET_MATERIAL]
description: Sets printer parameters based on material type
gcode:
  {% set MATERIAL = params.MATERIAL|default('ASA')|string|upper %}
  
  {% if MATERIAL == 'ASA' or MATERIAL == 'ABS' %}
    {action_respond_info("Setting parameters for ASA/ABS...")}
    SET_PRESSURE_ADVANCE ADVANCE=0.045 
    SET_RETRACTION RETRACT_LENGTH=0.5 RETRACT_SPEED=40 
    
  {% elif MATERIAL == 'PETG' %}
    {action_respond_info("Setting parameters for PETG...")}
    SET_PRESSURE_ADVANCE ADVANCE=0.06
    SET_RETRACTION RETRACT_LENGTH=0.8 RETRACT_SPEED=35
    
  {% elif MATERIAL == 'PLA' %}
    {action_respond_info("Setting parameters for PLA...")}
    SET_PRESSURE_ADVANCE ADVANCE=0.03
    SET_RETRACTION RETRACT_LENGTH=0.6 RETRACT_SPEED=45
    
  {% else %}
    {action_respond_info("Material profile not found. Using defaults.")}
  {% endif %}

