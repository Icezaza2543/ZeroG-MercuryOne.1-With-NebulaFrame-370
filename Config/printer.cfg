# This file contains common pin mappings for the BigTreeTech Octopus and Octopus Pro boards. 
# To use this config, start by identifying the micro-controller on the board - it may be an STM32F446, STM32F429, or an STM32H723.  
#Select the appropriate micro-controller in "make menuconfig" and select "Enable low-level configuration options". For
# For STM32H723 boards use a "128KiB bootloader" and a "25Mhz crystal".
# See docs/Config_Reference.md for a description of parameters.
[include macros.cfg]
[include KAMP_Settings.cfg]
[display_status]
[exclude_object]
[skew_correction]
[axis_twist_compensation]

[virtual_sdcard]
path: /home/pi3max/printer_data/gcodes

[pause_resume]
recover_velocity: 350

[idle_timeout]
timeout = 10800 #in seconds = 3Hr.

[gcode_arcs]
resolution: 0.05

[respond]
default_type: echo

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
minimum_cruise_ratio: 0.5
max_z_accel: 100
square_corner_velocity: 10.0

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_3D0011001751313431393536-if00
# canbus_uuid= 
# CAN bus is also available on this board
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100
[mcu EBBCan]
canbus_uuid= 1a248188cc87

[mcu cartographer]        
serial: /dev/serial/by-id/usb-Cartographer_614e_2C000B000F43304146393320-if00           
#backlash_comp: 0.00314
restart_method: command
#mesh_runs: 2

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 21
verbose: no 

[bed_mesh]
zero_reference_position: 198.50, 179.00
speed: 200
horizontal_move_z: 12
mesh_min: 20, 21
mesh_max: 359, 345
probe_count: 24, 24
algorithm: bicubic
bicubic_tension: 0.42

[z_tilt]
z_positions: 
  -40, -50 #stepper_z Mini Tank
  417, -50 #stepper_z1 Mini Tank
  187.5, 421 #stepper_z2 Mini Tank
points:
  50,23           # ซ้ายหน้า (BL)
  331,23          # ขวาหน้า (BR)
  190,300         # ด้านหลัง (Rear)
speed: 350
horizontal_move_z: 15
retries: 10
retry_tolerance: 0.008

[adxl345]
cs_pin: EBBCan: PB12
spi_software_sclk_pin: EBBCan: PB10
spi_software_mosi_pin: EBBCan: PB11
spi_software_miso_pin: EBBCan: PB2
axes_map: x,y,z

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 10
keep_raw_data: False
show_macros_in_webui: True
timeout: 600
measurements_chunk_size: 2
max_freq: 200
dpi: 300

[resonance_tester]
accel_chip: adxl345
probe_points: 180,165,10

[safe_z_home] 
home_xy_position: 198.5,179.00
z_hop: 2
z_hop_speed: 20
speed: 150

[force_move]
enable_force_move: True

#==================================================
# Driver0
[stepper_x] #LDO-42STH48-2804AH-R 2.8A 
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: EBBCan:PB6
position_endstop: 0
position_max: 398
homing_speed: 150
[tmc5160 stepper_x]
cs_pin: PC4
spi_bus: spi1
run_current: 1.9700
interpolate: true
stealthchop_threshold: 0
#interpolate: true
#tealthchop_threshold: 999999


# Driver1
[stepper_y] #LDO-42STH48-2804AH-R 2.8A 
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: PG6
position_endstop: 0
position_max: 390
homing_speed: 150
[tmc5160 stepper_y]
cs_pin: PD11
spi_bus: spi1
run_current: 1.9700
interpolate: true
stealthchop_threshold: 0
#interpolate: true
#stealthchop_threshold: 999999

# Driver5 
[stepper_z]  #42DND887C-20D18 1.7A 0.55 N.m
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0
position_min: -30.0
position_max: 375
homing_speed: 10
[tmc2209 stepper_z]
uart_pin: PE4
diag_pin: PG10
run_current: 1.45
hold_current: 1.00
interpolate: true
stealthchop_threshold: 0

# Driver6
[stepper_z1] #42DND887C-20D18 1.7A 0.55 N.m
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
[tmc2209 stepper_z1]
uart_pin: PE1
diag_pin: PG11
run_current: 1.45
hold_current: 1.00
interpolate: true
stealthchop_threshold: 0


# Driver7

[stepper_z2] #42DND887C-20D18 1.7A 0.55 N.m
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
[tmc2209 stepper_z2]
uart_pin: PD3
diag_pin: PG12
run_current: 1.45
hold_current: 1.00
interpolate: true
stealthchop_threshold: 0

