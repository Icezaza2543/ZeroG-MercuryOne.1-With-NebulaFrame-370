[filament_switch_sensor LLL_Buffer]
pause_on_runout: False
switch_pin: ^!PG12
event_delay: 1.5
pause_delay: 0.25
runout_gcode:
  RESPOND TYPE=echo MSG="LLL Filament Out"
insert_gcode:
  RESPOND TYPE=echo MSG="LLL Filament Inserted"

[filament_switch_sensor mdm_switch_sensor]
switch_pin: ^PG13
pause_on_runout: True
runout_gcode:
    PAUSE
    RESPOND TYPE=echo MSG="Filament out"
event_delay: 1.0
pause_delay: 0.5

