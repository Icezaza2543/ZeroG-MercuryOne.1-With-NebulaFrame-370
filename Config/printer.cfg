#==================================================
[heater_bed]
heater_pin: PA1
sensor_pin: PF3 # TB
sensor_type: EPCOS 100K B57560G104F
#control: pid
#pid_Kp: 63.133
#pid_Ki: 3.263
#pid_Kd: 305.405
min_temp: 0
max_temp: 150

[output_pin Extruder_fan] #EBB Cooling 4040 Fan
pin: EBBCan: PA0
pwm: True
value: 1.0
shutdown_value: 0
[fan]
pin: EBBCan: PA1

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 105

[temperature_sensor EBB36]
sensor_type: temperature_mcu
sensor_mcu: EBBCan
min_temp: 0
max_temp: 100

#TB-PF3 T0-PF4 T1-PF5 T2-PF6 T3-PF7

[temperature_sensor Chamber_REAR]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF4
[temperature_sensor Chamber_RIGHT]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF5
[temperature_sensor Chamber_LEFT]
sensor_type: EPCOS 100K B57560G104F
sensor_pin:PF6

[temperature_sensor Chamber_average]
sensor_type: temperature_combined
sensor_list: temperature_sensor Chamber_REAR, temperature_sensor Chamber_RIGHT, temperature_sensor Chamber_LEFT
combination_method: mean
maximum_deviation: 50.0
min_temp: 0
max_temp: 80

[temperature_sensor Electronics]
sensor_type: EPCOS 100K B57560G104F
sensor_pin:PF7
########################################

[output_pin MBfan1]
pin: PD13
value: 1.0
shutdown_value: 1.0

[output_pin MBfan2]
pin: PD14
value: 1.0
shutdown_value: 1.0

########################################

[output_pin LED_Left]
pin: PE5
value: 1          # ตั้งค่าเริ่มต้นเป็น 1 (เปิด)
shutdown_value: 0 # ตั้งค่าเมื่อ shutdown เป็น 0 (ปิด)

[output_pin LED_Right]
pin: PA8
value: 1          # ตั้งค่าเริ่มต้นเป็น 1 (เปิด)
shutdown_value: 0 # ตั้งค่าเมื่อ shutdown เป็น 0 (ปิด)

#[output_pin Circulation_Fan]
#pin: PD12
#pwm: True
#value: 0.6
#shutdown_value: 0

[neopixel hotend_rgb]
pin: EBBCan:PD3
chain_count: 1
color_order: GRBW
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0
initial_WHITE: 1.0

[firmware_retraction]
retract_length: 0
retract_speed: 20
unretract_extra_length: 0
unretract_speed: 10

